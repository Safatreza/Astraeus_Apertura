version: '3.8'

services:
  # Main API/Dashboard service
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: dashboard
    ports:
      - "8050:8050"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NOTION_API_KEY=${NOTION_API_KEY}
      - LOG_LEVEL=INFO
      - ENVIRONMENT=development
    volumes:
      - ./output:/app/output
      - ./logs:/app/logs
    networks:
      - astraeus-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8050/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Worker service for parallel job execution
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - WORKER_THREADS=8
      - LOG_LEVEL=INFO
      - ENVIRONMENT=development
    volumes:
      - ./output:/app/output
      - ./logs:/app/logs
      - job-data:/app/data
    networks:
      - astraeus-network
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '4'
          memory: 8G

  # PostgreSQL for production job queue (optional upgrade from SQLite)
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=astraeus
      - POSTGRES_USER=astraeus
      - POSTGRES_PASSWORD=${DB_PASSWORD:-changeme}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - astraeus-network
    restart: unless-stopped
    ports:
      - "5432:5432"

  # Redis for caching and job queuing (optional)
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - astraeus-network
    restart: unless-stopped
    ports:
      - "6379:6379"

  # Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
    depends_on:
      - dashboard
    networks:
      - astraeus-network
    restart: unless-stopped

  # Monitoring with Prometheus (optional)
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - astraeus-network
    restart: unless-stopped

  # Grafana for visualization (optional)
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - astraeus-network
    restart: unless-stopped

networks:
  astraeus-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  job-data:
  prometheus-data:
  grafana-data:
