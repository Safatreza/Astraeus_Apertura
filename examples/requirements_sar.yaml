# SAR Antenna Requirements Example
# X-Band Synthetic Aperture Radar for Earth Observation

mission_name: "X-Band SAR for Earth Observation"
mission_type: "sar"

frequency:
  center_frequency_ghz: 10.0
  bandwidth_mhz: 200.0
  frequency_band: "X"

radiation_pattern:
  gain_dbi: 35.0
  beamwidth_azimuth_deg: 3.0
  beamwidth_elevation_deg: 3.0
  sidelobe_level_db: -25.0

polarization: "linear_horizontal"

physical_constraints:
  max_mass_kg: 5.0
  max_length_m: 1.0
  max_width_m: 1.0
  max_height_m: 0.3
